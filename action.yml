name: envguard
description: Keep .env.example in sync with the environment variables your code actually reads
author: Muhammad Dani Noar

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan
    required: false
    default: "."
  example:
    description: Path to the example env file (auto-detected when empty)
    required: false
    default: ""
  strict:
    description: Fail the job when variables are missing or undeclared
    required: false
    default: "true"
  fix:
    description: Append missing keys to the example file
    required: false
    default: "false"
  args:
    description: Extra arguments forwarded to the envguard CLI
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run envguard
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXAMPLE: ${{ inputs.example }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        args=("$INPUT_PATH")
        if [ -n "$INPUT_EXAMPLE" ]; then args+=(--example "$INPUT_EXAMPLE"); fi
        if [ "$INPUT_STRICT" = "true" ]; then args+=(--strict); fi
        if [ "$INPUT_FIX" = "true" ]; then args+=(--fix); fi
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/bin/envguard.js" "${args[@]}" $INPUT_ARGS
